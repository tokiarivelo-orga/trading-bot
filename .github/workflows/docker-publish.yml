# Builds and publishes the backend + frontend production images to Docker
# Hub, multi-arch (linux/amd64, linux/arm64). This workflow is INERT until
# two repo secrets are configured (Settings > Secrets and variables >
# Actions):
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN   (a Docker Hub access token, not your account password)
#
# <!-- TODO: DOCKERHUB_NAMESPACE below defaults to the placeholder
#      "tradingbot" — swap for the real Docker Hub username/org once
#      confirmed (see also docker-compose.prod.yml and README.md). -->
#
# Triggers: push a version tag (e.g. `git tag v0.1.0 && git push origin
# v0.1.0`), or run manually via Actions > Docker Publish > Run workflow.
# Nothing here runs on every push/PR — it never fires on its own.

name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'tradingbot' }} # <!-- TODO: placeholder namespace -->

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest
