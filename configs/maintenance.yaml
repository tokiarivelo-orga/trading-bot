# Housekeeping for tables/files that grow unbounded otherwise (SQLite has no
# built-in retention — see docs/ for the investigation that led here).

# activity_logs mirrors every `logging.getLogger("src.*")` INFO+ call
# (see shared/logging) — diagnostic only, safe to age out.
activity_log:
  retention_days: 90        # rows older than this get purged
  check_interval_hours: 6   # how often the purge job runs

# `PRAGMA journal_mode=wal` lets the -wal file grow unbounded between
# checkpoints. No-ops automatically on a non-SQLite engine (e.g. after the
# planned PostgreSQL migration, see IMPLEMENTATION_PLAN.md).
wal_checkpoint:
  enabled: true
  interval_minutes: 15

# Bi-weekly retraining of the deep-learning models, run in-process through
# the same service the "Train" button uses (see
# strategies/application/training_scheduler.py). Lives here rather than in
# its own file because it is the same kind of thing as the jobs above: a
# recurring background task with a lifecycle owned by the backend process.
#
# `scripts/cron_train_models.sh` remains a valid alternative for machines
# that would rather drive this from crontab — set `enabled: false` here if
# you use it, so the two do not both fire.
model_training:
  enabled: true
  interval_days: 14
  # Train immediately on backend startup as well. Off by default: a restart
  # should not kick off a multi-minute CPU job while the trade engine is
  # still coming up.
  train_on_startup: false
  # Symbols to retrain, in order. Empty means "every symbol in app.yaml".
  symbols: [XAUUSD]
