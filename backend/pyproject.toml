[project]
name = "trading-bot-backend"
version = "0.1.0"
description = "AI trading bot backend — engine, strategies, AI layer, journal"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "httpx>=0.28",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "cryptography>=49.0.0",
    "keyring>=25.7.0",
    "python-socketio>=5.16.3",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "anthropic>=0.116.0",
    "pymupdf>=1.28.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "prometheus-client>=0.26.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv]
package = false
