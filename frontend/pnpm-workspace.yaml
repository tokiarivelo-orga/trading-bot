# pnpm settings (pnpm 10+ reads these here, not from package.json).
# sharp is Next.js's image optimizer; its native build script is trusted.
allowBuilds:
  sharp: true

# Force transitive deps past Dependabot-flagged versions their parent
# packages alone wouldn't pull (postcss/sharp/socket.io-parser pinned deep
# inside next/@tailwindcss/postcss/socket.io-client; nanoid pinned by postcss).
overrides:
  postcss: ">=8.5.23"
  sharp: ">=0.35.0"
  socket.io-parser: ">=4.2.7"
  nanoid: ">=3.3.18"
